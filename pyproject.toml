[tool.agentic-os.repo-pointer-skills]
org = "coilyco-gaming"

# mods/ carries one public listing README per mod, the copy that ships to
# mod.io, and unity/ vendors the EcoModKit SDK with its upstream docs. Neither
# shape is this repo's to choose, mirroring eco-app and eco-ops.
[tool.agentic-os.documentation-layout]
band = "small"
excludes = [
  "mods/",
  "unity/",
  "unity-embedded/",
]

# The managed markers are stamped inside the pre-commit YAML and
# cannot form a single top-of-file comment block.
[tool.agentic-os.code-comments]
excludes = [".pre-commit-config.yaml"]

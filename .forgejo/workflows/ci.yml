name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: Root hygiene
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.195.0
    steps:
      - uses: actions/checkout@v4
      - name: Root hygiene baseline
        run: |
          set -euo pipefail
          git diff --check
          test -f .gitattributes
          test -f .ward/ward.yaml

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        uses: coilysiren/agentic-os/actions/telegram-alert@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
  mods:
    name: mods code path
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.195.0
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        working-directory: mods
        run: python -m compileall .
      - name: dotnet build
        working-directory: mods
        run: dotnet build eco-mods-public.sln --nologo

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        uses: coilysiren/agentic-os/actions/telegram-alert@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
  secrets:
    name: Repo secret scan
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.195.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: TruffleHog (filesystem, offline)
        run: |
          cat > /tmp/trufflehog-exclude <<'EOF'
          (^|/)\.git/
          (^|/)\.venv/
          (^|/)venv/
          (^|/)node_modules/
          (^|/)__pycache__/
          (^|/)\.mypy_cache/
          (^|/)\.pytest_cache/
          (^|/)\.ruff_cache/
          (^|/)data/.*\.json$
          EOF
          trufflehog filesystem . \
            --no-verification --no-update --fail \
            --exclude-paths=/tmp/trufflehog-exclude
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        uses: coilysiren/agentic-os/actions/telegram-alert@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
